- name: Maintain packages
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  vars_files:
    - vars-packages.yml

  tasks:
    - name: Install pacman packages
      tags: [packages]
      community.general.pacman:
        name: "{{ pacman_packages_core + pacman_packages_hypr }}"
        state: present
        update_cache: true

    - name: Create aur_builder user
      tags: [aur]
      ansible.builtin.user:
        name: aur_builder
        state: present
        create_home: true
        group: wheel

    - name: Allow aur_builder to run pacman without a password
      tags: [aur]
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/11-install-aur_builder
        line: "aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman"
        create: true
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Check whether paru is installed
      tags: [aur]
      ansible.builtin.command: which paru
      register: paru_check
      changed_when: false
      failed_when: false

    - name: Fail if paru is not installed
      tags: [aur]
      ansible.builtin.fail:
        msg: "paru is required before installing AUR packages."
      when: paru_check.rc != 0

    - name: Install AUR packages using paru
      tags: [aur]
      kewlfft.aur.aur:
        use: paru
        name: "{{ aur_packages }}"
        state: present
      become: true
      become_user: aur_builder


