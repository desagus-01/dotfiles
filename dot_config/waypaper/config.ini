[Settings]
language = en
folder = ~/Pictures/wallpaper
backend = hyprpaper
post_command = env wallpaper="$wallpaper" bash -lc '/home/gus/.config/hypr/scripts/wallpaper.sh "$wallpaper"'
number_of_columns = 3
swww_transition_type = any
swww_transition_step = 90
swww_transition_angle = 0
swww_transition_duration = 2
swww_transition_fps = 60
use_xdg_state = True
show_path_in_tooltip = True
all_subfolders = False
zen_mode = False
stylesheet = /home/gus/.config/waypaper/style.css
monitors = All
fill = fill
sort = name
color = #ffffff
subfolders = False
show_hidden = False
show_gifs_only = False

